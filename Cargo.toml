[workspace]
members = ["musical-lights-core"]
exclude = [
    "musical-adafruit-sparkle-embassy",
    "musical-adafruit-sparkle-idf",
    "musical-dioxus",
    "musical-feather-m0",
    "musical-leptos",
    "musical-stm32",
    "musical-terminal",
    "musical-wasm",
    "musical-lights-worklet",
    "musical-lights-physics",
    "musical-recognition-worker",
    "validation/benchmarks",
]
resolver = "2"

# Match the standalone physics tests: exercise DSP workloads without debug-build
# computation overhead while retaining the checks that catch correctness bugs.
[profile.test]
opt-level = 2
debug-assertions = true
overflow-checks = true

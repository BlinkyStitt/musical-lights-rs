[package]
name = "musical-stm32"
version = "1.0.0"
authors = ["Bryan Stitt <bryan@stitthappens.com>"]
description = "Musical Lights for STM32"
repository = "https://github.com/WyseNynja/musical-lights-rs"
readme = "README.md"
edition = "2024"
resolver = "2"
default-run = "sensors_for_sparkle"

[dependencies]
ahrs = { git = "https://github.com/jmagnuson/ahrs-rs", rev = "0b04dfe5e23fd0af9dbea1d24116e4c5b69d3ed9", default-features = false }
circular-buffer = { version = "=2.0.1", default-features = false }
cortex-m = { version = "=0.7.9", features = [
    "inline-asm",
    "critical-section-single-core",
] }
cortex-m-rt = "=0.7.6"
defmt = "=1.1.1"
defmt-rtt = "=1.3.0"
embassy-embedded-hal = "=0.6.0"
embassy-executor = { version = "=0.10.0", features = [
    "platform-cortex-m",
    "executor-thread",
    "executor-interrupt",
    "defmt",
] }
embassy-futures = "=0.1.2"
embassy-stm32 = { version = "=0.6.0", features = [
    "defmt",
    "stm32f411ce",
    "unstable-pac",
    "memory-x",
    "time-driver-any",
    "exti",
] }
embassy-sync = { version = "=0.8.0", features = ["defmt"] }
embassy-time = { version = "=0.5.1", features = [
    "defmt",
    "defmt-timestamp-uptime",
    "tick-hz-32_768",
] }
embedded-alloc = { version = "=0.7.0", default-features = false, features = [
    "llff",
] }
embedded-io-async = { version = "=0.7.0", features = ["defmt"] }
enterpolation = { version = "=0.3.0", default-features = false, features = [
    "libm",
    "linear",
] }
heapless = { version = "=0.9.3", features = [
    "defmt",
    "serde",
    "portable-atomic-critical-section",
] }
itertools = { version = "=0.15.0", default-features = false }
lsm9ds1 = { git = "https://github.com/BlinkyStitt/lsm9ds1", rev = "eacd62cb6a1c2dda962ed8d2546566925472e586" }
micromath = "=2.1.0"
musical-lights-core = { path = "../musical-lights-core", default-features = false, features = [
    "libm",
    "defmt",
    "embassy",
] }
nalgebra = { version = "=0.35.0", default-features = false }
palette = { version = "=0.7.7", features = ["libm"], default-features = false }
panic-probe = { version = "=1.0.0", features = ["print-defmt"] }
postcard = { version = "=1.1.3", default-features = false, features = [
    "heapless",
    "use-crc",
    "use-defmt",
] }
serde = { version = "=1.0.229", default-features = false, features = ["derive"] }
smart-leds = "=0.4.0"
smart-leds-trait = "=0.3.2"
static_cell = { version = "=2.1.1", features = ["nightly"] }
ws2812-async = "=0.4.0"

# TODO: do i want this?

[features]

[profile.dev]
incremental = false
codegen-units = 1
debug = true
lto = true

# timings on neopixels are very sensitive. i think we will need "3", but it might not fit!
# # TODO: optimisize for size when compiling?
opt-level = 3

[profile.release]
debug = true
lto = true

opt-level = 3

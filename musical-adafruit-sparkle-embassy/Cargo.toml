[package]
edition = "2024"
name = "musical-adafruit-sparkle"
version = "0.1.0"
resolver = "2"

[[bin]]
name = "musical-adafruit-sparkle"
path = "./src/bin/main.rs"

[dependencies]

defmt = "=1.1.1"
embedded-io = "=0.7.1"
embedded-io-async = "=0.7.0"
esp-alloc = { version = "=0.11.0", features = ["esp32"] }
esp-backtrace = { version = "=0.20.0", features = [
  "defmt",
  "esp32",
  "panic-handler",
] }
esp-hal = { version = "=1.2.1", features = ["defmt", "esp32", "unstable"] }
esp-println = { version = "=0.18.0", features = ["defmt-espflash", "esp32"] }
# for more networking protocol support see https://crates.io/crates/edge-net
critical-section = "=1.2.0"
embassy-executor = { version = "=0.10.0", features = ["defmt"] }
embassy-sync = { version = "=0.8.0", features = ["defmt"] }
embassy-futures = { version = "=0.1.2", features = ["defmt"] }
embassy-time = { version = "=0.5.1", features = [] }
esp-rtos = { version = "=0.4.0", features = ["esp32", "embassy", "defmt"] }
esp-hal-smartled = { version = "=0.18.0", features = ["defmt", "esp32"] }
heapless = { version = "=0.9.3", default-features = false }
lsm9ds1 = { git = "https://github.com/BlinkyStitt/lsm9ds1", rev = "eacd62cb6a1c2dda962ed8d2546566925472e586" }
musical-lights-core = { path = "../musical-lights-core", default-features = false, features = [
  "defmt",
  "embassy",
  "libm",
] }
static_cell = { version = "=2.1.1", features = ["nightly"] }
smart-leds = "=0.4.0"
sx1262 = { version = "=0.3.0", features = ["defmt"] }
ws2812-async = "=0.4.0"

# TODO: i think its only a blocking method of writing though. so i don't know if we want it. maybe its okay if we keep it on core 1?

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units = 1        # LLVM can perform better optimizations using a single thread
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 's'
overflow-checks = false

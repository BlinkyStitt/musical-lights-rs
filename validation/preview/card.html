<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<title>Musical Lights share image</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; width: 1200px; height: 630px; overflow: hidden; color: #E3EAF2; background: #0F1722; font-family: "Comic Sans MS", "Comic Sans", sans-serif; text-align: center; }
  .card { height: 100%; padding: 44px 72px 32px; background: radial-gradient(ellipse at 50% 100%, #203345, transparent 75%); }
  .brand { margin: 0; color: #A8B8CB; font-size: 15px; font-weight: 700; letter-spacing: 5px; }
  h1 { margin: 17px 0 8px; font-size: 72px; line-height: 1.2; letter-spacing: -3px; }
  .tagline { margin: 0; font-size: 24px; color: #A8B8CB; }
  .spectrum { display: grid; grid-template-columns: repeat(24, 1fr); align-items: end; gap: 10px; height: 268px; margin-top: 32px; padding-bottom: 8px; border-bottom: 1px solid #33465C; }
  .bar { border-radius: 7px 7px 2px 2px; }
  .domain { margin: 25px 0 0; font-size: 18px; letter-spacing: 1px; color: #A8B8CB; }
</style>
<main class="card">
  <p class="brand">STITT HAPPENS</p>
  <h1>Musical Lights</h1>
  <p class="tagline">See your sound. In full color.</p>
  <div class="spectrum" aria-hidden="true"></div>
  <p class="domain">blink.stitthappens.com</p>
</main>
</html>

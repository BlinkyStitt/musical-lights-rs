name: Firmware validation
on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'musical-lights-core/**'
      - 'validation/ci.py'
      - 'validation/validate.py'
      - 'validation/install_tools.py'
      - 'validation/tooling/**'
      - '.github/workflows/firmware.yml'
      - '**/.cargo/**'
      - '**/rust-toolchain*'
      - 'musical-feather-m0/**'
      - 'musical-stm32/**'
      - 'musical-adafruit-sparkle-embassy/**'
      - 'musical-adafruit-sparkle-idf/**'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'musical-lights-core/**'
      - 'validation/ci.py'
      - 'validation/validate.py'
      - 'validation/install_tools.py'
      - 'validation/tooling/**'
      - '.github/workflows/firmware.yml'
      - '**/.cargo/**'
      - '**/rust-toolchain*'
      - 'musical-feather-m0/**'
      - 'musical-stm32/**'
      - 'musical-adafruit-sparkle-embassy/**'
      - 'musical-adafruit-sparkle-idf/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    name: Affected firmware
    runs-on: ubuntu-24.04
    outputs:
      rust: ${{ steps.changes.outputs.rust }}
      esp: ${{ steps.changes.outputs.esp }}
      rust_matrix: ${{ steps.changes.outputs.rust_matrix }}
      esp_matrix: ${{ steps.changes.outputs.esp_matrix }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: changes
        run: python3 validation/ci.py changes
  rust:
    name: rust (${{ matrix.package }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.rust_matrix) }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Cache Rust dependencies and builds
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ matrix.directory }}/target
          key: firmware-v2-${{ matrix.package }}-${{ runner.os }}-${{ runner.arch }}-nightly-2026-09-10-${{ hashFiles(format('{0}/Cargo.lock', matrix.directory)) }}-${{ hashFiles('musical-lights-core/src/**/*.rs', 'musical-lights-core/Cargo.toml', format('{0}/src/**/*.rs', matrix.directory), format('{0}/Cargo.toml', matrix.directory), format('{0}/build.rs', matrix.directory), '**/.cargo/**', '**/rust-toolchain*') }}
          restore-keys: |
            firmware-v2-${{ matrix.package }}-${{ runner.os }}-${{ runner.arch }}-nightly-2026-09-10-${{ hashFiles(format('{0}/Cargo.lock', matrix.directory)) }}-
      - name: Install Rust
        run: rustup toolchain install nightly-2026-09-10 --profile minimal --component rust-src,rustfmt,clippy --target thumbv6m-none-eabi,thumbv7em-none-eabihf
      - run: python3 validation/validate.py ${{ matrix.package }}
  esp:
    name: esp (${{ matrix.package }})
    needs: changes
    if: needs.changes.outputs.esp == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.esp_matrix) }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Cache Rust dependencies and builds
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ matrix.directory }}/target
          key: esp-v2-${{ matrix.package }}-${{ runner.os }}-${{ runner.arch }}-esp-1.98.1.0-${{ hashFiles(format('{0}/Cargo.lock', matrix.directory)) }}-${{ hashFiles('musical-lights-core/src/**/*.rs', 'musical-lights-core/Cargo.toml', format('{0}/src/**/*.rs', matrix.directory), format('{0}/Cargo.toml', matrix.directory), format('{0}/build.rs', matrix.directory), '**/.cargo/**', '**/rust-toolchain*') }}
          restore-keys: |
            esp-v2-${{ matrix.package }}-${{ runner.os }}-${{ runner.arch }}-esp-1.98.1.0-${{ hashFiles(format('{0}/Cargo.lock', matrix.directory)) }}-
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14.7'
      - name: Install host Rust and linker
        run: |
          rustup toolchain install nightly-2026-09-10 --profile minimal --component rust-src,rustfmt,clippy
      - name: Cache pinned ESP installers
        id: esp-tools
        uses: actions/cache@v6.1.0
        with:
          path: .tools
          key: esp-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('validation/install_tools.py') }}
      - run: python3 validation/install_tools.py esp
        if: steps.esp-tools.outputs.cache-hit != 'true'
      - name: Install exact Xtensa toolchain
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .tools/bin/espup install --toolchain-version 1.98.1.0 --name esp-1.98.1.0 --targets esp32 --export-file "$RUNNER_TEMP/export-esp.sh"
      - name: Validate firmware
        run: |
          . "$RUNNER_TEMP/export-esp.sh"
          python3 validation/validate.py ${{ matrix.package }}

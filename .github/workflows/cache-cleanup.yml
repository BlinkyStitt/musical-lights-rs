name: Remove closed PR caches
on:
  pull_request:
    types: [closed]
permissions:
  actions: write
  contents: read
jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Remove caches scoped only to the closed PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh cache delete --all --succeed-on-no-caches --ref "refs/pull/$PR_NUMBER/merge"

name: Clean up closed PR validation
on:
  pull_request:
    types: [closed]
permissions:
  actions: write
  contents: read
  pull-requests: read
jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ski-kvm-musical-linux
    steps:
      - name: Cancel validation started before this close
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const closed = context.payload.pull_request;
            const repositoryId = context.payload.repository.id;
            const cutoff = Date.parse(closed.closed_at);
            if (!Number.isFinite(cutoff) || closed.head.repo?.id !== repositoryId) return;

            const { data: current } = await github.rest.pulls.get({
              ...context.repo, pull_number: closed.number,
            });
            if (current.state !== 'closed' || current.closed_at !== closed.closed_at) return;

            const workflows = [
              'firmware.yml', 'gpu-runner-health.yml', 'other-apps.yml',
              'recognition.yml', 'security-scan.yml', 'validate.yml',
            ];
            const active = new Set(['queued', 'in_progress', 'requested', 'waiting', 'pending']);
            for (const workflow_id of workflows) {
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                ...context.repo, workflow_id, event: 'pull_request',
                branch: closed.head.ref, created: `<${closed.closed_at}`, per_page: 100,
              });
              for (const run of runs) {
                // Reruns keep the original creation date. Runs created in the
                // same second as closure have ambiguous order.
                if (run.event !== 'pull_request' || run.run_attempt !== 1 ||
                    !active.has(run.status) || !(Date.parse(run.created_at) < cutoff) ||
                    !run.pull_requests?.some(pr => pr.number === closed.number &&
                        pr.base.repo.id === repositoryId && pr.head.repo.id === repositoryId)) continue;
                try {
                  await github.rest.actions.cancelWorkflowRun({
                    ...context.repo, run_id: run.id,
                  });
                } catch (error) {
                  if (error.status !== 409) throw error;
                }
              }
            }
      - name: Remove caches scoped only to the closed PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const ref = `refs/pull/${context.payload.pull_request.number}/merge`;
            const caches = await github.paginate(github.rest.actions.getActionsCacheList, {
              ...context.repo, ref, per_page: 100,
            });
            for (const cache of caches) {
              await github.rest.actions.deleteActionsCacheById({
                ...context.repo, cache_id: cache.id,
              });
            }

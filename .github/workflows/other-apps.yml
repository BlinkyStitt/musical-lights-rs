name: Other applications validation
on:
  push:
    branches: [main]
    paths:
      - 'musical-lights-core/**'
      - 'validation/**'
      - '.github/workflows/**'
      - '**/.cargo/**'
      - '**/rust-toolchain*'
      - 'musical-terminal/**'
      - 'musical-dioxus/**'
      - 'musical-wasm/**'
  pull_request:
    paths:
      - 'musical-lights-core/**'
      - 'validation/**'
      - '.github/workflows/**'
      - '**/.cargo/**'
      - '**/rust-toolchain*'
      - 'musical-terminal/**'
      - 'musical-dioxus/**'
      - 'musical-wasm/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  terminal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Cache Rust dependencies and builds
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            musical-terminal/target
          key: terminal-rust-${{ runner.os }}-${{ runner.arch }}-nightly-2026-09-10-${{ hashFiles('musical-terminal/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            terminal-rust-${{ runner.os }}-${{ runner.arch }}-nightly-2026-09-10-${{ hashFiles('musical-terminal/Cargo.lock') }}-
      - name: Install Rust
        run: rustup toolchain install nightly-2026-09-10 --profile minimal --component rust-src,rustfmt,clippy
      - name: Install terminal libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libsdl2-dev
      - run: python3 validation/validate.py terminal
  demos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Cache Rust dependencies and builds
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            musical-dioxus/target
            musical-wasm/target
          key: demos-rust-${{ runner.os }}-${{ runner.arch }}-nightly-2026-09-10-${{ hashFiles('musical-dioxus/Cargo.lock', 'musical-wasm/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            demos-rust-${{ runner.os }}-${{ runner.arch }}-nightly-2026-09-10-${{ hashFiles('musical-dioxus/Cargo.lock', 'musical-wasm/Cargo.lock') }}-
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '26.8.2'
          cache: npm
          cache-dependency-path: validation/package-lock.json
      - name: Install Rust
        run: rustup toolchain install nightly-2026-09-10 --profile minimal --component rust-src,rustfmt,clippy --target wasm32-unknown-unknown
      - name: Cache pinned demo tools
        id: demo-tools
        uses: actions/cache@v6.1.0
        with:
          path: .tools
          key: demo-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('validation/install_tools.py') }}
      - run: python3 validation/install_tools.py demos
        if: steps.demo-tools.outputs.cache-hit != 'true'
      - run: python3 validation/validate.py dioxus wasm
      - run: cd validation && npm ci --ignore-scripts && npx playwright install --with-deps chromium && npm run test:demos
        env:
          DEBUG: pw:browser
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: demo-browser-validation
          path: validation/test-results/
          if-no-files-found: ignore

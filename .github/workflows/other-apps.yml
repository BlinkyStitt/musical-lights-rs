name: Other applications validation
on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'musical-lights-core/**'
      - 'validation/ci.py'
      - 'validation/validate.py'
      - 'validation/install_tools.py'
      - 'validation/tooling/**'
      - 'validation/demos.config.mjs'
      - 'validation/tests/other-apps.spec.mjs'
      - 'validation/browser-*'
      - 'validation/server.mjs'
      - 'validation/package*.json'
      - '.github/workflows/other-apps.yml'
      - '**/.cargo/**'
      - '**/rust-toolchain*'
      - 'musical-terminal/**'
      - 'musical-dioxus/**'
      - 'musical-wasm/**'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    name: Affected other-apps
    runs-on: ski-kvm-musical-linux
    outputs:
      terminal: ${{ steps.changes.outputs.terminal }}
      demos: ${{ steps.changes.outputs.demos }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: changes
        run: python3 validation/ci.py changes
  terminal:
    needs: changes
    if: needs.changes.outputs.terminal == 'true'
    runs-on: ski-kvm-musical-linux
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --user 0
    defaults:
      run:
        shell: bash
    env:
      CARGO_HOME: /github/home/.cargo
      RUSTUP_HOME: /github/home/.rustup
    steps:
      - name: Install terminal build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git python3 build-essential pkg-config libasound2-dev libsdl2-dev
      - uses: actions/checkout@v7.0.1
      - name: Cache Rust dependencies and builds
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            musical-terminal/target
          key: terminal-v3-k3s-${{ runner.os }}-${{ runner.arch }}-nightly-2026-09-10-${{ hashFiles('musical-terminal/Cargo.lock') }}-${{ hashFiles('musical-lights-core/src/**/*.rs', 'musical-lights-core/Cargo.toml', 'musical-terminal/src/**/*.rs', 'musical-terminal/examples/**/*.rs', 'musical-terminal/Cargo.toml', '**/.cargo/**', '**/rust-toolchain*') }}
          restore-keys: |
            terminal-v3-k3s-${{ runner.os }}-${{ runner.arch }}-nightly-2026-09-10-${{ hashFiles('musical-terminal/Cargo.lock') }}-
      - name: Install Rust and validate the terminal application
        run: |
          python3 validation/install_tools.py rust
          export PATH="$CARGO_HOME/bin:$PATH"
          rustup toolchain install nightly-2026-09-10 --profile minimal --component rust-src,rustfmt,clippy
          python3 validation/validate.py terminal
  demos:
    needs: changes
    if: needs.changes.outputs.demos == 'true'
    runs-on: ski-kvm-musical-linux
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Cache Rust dependencies and builds
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            musical-dioxus/target
            musical-wasm/target
          key: demos-v2-${{ runner.os }}-${{ runner.arch }}-nightly-2026-09-10-${{ hashFiles('musical-dioxus/Cargo.lock', 'musical-wasm/Cargo.lock') }}-${{ hashFiles('musical-lights-core/src/**/*.rs', 'musical-lights-core/Cargo.toml', 'musical-dioxus/src/**/*.rs', 'musical-wasm/src/**/*.rs', 'musical-dioxus/Cargo.toml', 'musical-wasm/Cargo.toml', '**/.cargo/**', '**/rust-toolchain*') }}
          restore-keys: |
            demos-v2-${{ runner.os }}-${{ runner.arch }}-nightly-2026-09-10-${{ hashFiles('musical-dioxus/Cargo.lock', 'musical-wasm/Cargo.lock') }}-
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26.12.1'
          cache: npm
          cache-dependency-path: validation/package-lock.json
      - run: python3 validation/install_tools.py rust
      - name: Install Rust
        run: rustup toolchain install nightly-2026-09-10 --profile minimal --component rust-src,rustfmt,clippy --target wasm32-unknown-unknown
      - name: Cache pinned demo tools
        id: demo-tools
        uses: actions/cache@v6.1.0
        with:
          path: .tools
          key: demo-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('validation/install_tools.py') }}
      - run: python3 validation/install_tools.py demos
        if: steps.demo-tools.outputs.cache-hit != 'true'
      - run: python3 validation/validate.py dioxus wasm
      - run: cd validation && npm ci --ignore-scripts && npx playwright install chromium && npm run test:demos
        env:
          DEBUG: pw:browser
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: demo-browser-validation
          path: validation/test-results/
          if-no-files-found: ignore
          retention-days: ${{ job.status == 'failure' && 7 || 2 }}
  required:
    name: Required other-application checks
    needs: [changes, terminal, demos]
    if: always()
    runs-on: ski-kvm-musical-linux
    steps:
      - uses: actions/checkout@v7.0.1
      - run: python3 validation/ci.py required-checks other-apps
        env:
          CI_NEEDS: ${{ toJSON(needs) }}

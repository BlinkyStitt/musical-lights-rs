name: Website validation and deployment
on:
  push:
    branches: [main]
    paths:
      - 'musical-lights-core/**'
      - 'validation/**'
      - '.github/workflows/**'
      - '**/.cargo/**'
      - '**/rust-toolchain*'
      - 'musical-leptos/**'
      - 'musical-lights-worklet/**'
      - 'musical-lights-physics/**'
      - 'docs/audio-audit-results/**'
  pull_request:
    paths:
      - 'musical-lights-core/**'
      - 'validation/**'
      - '.github/workflows/**'
      - '**/.cargo/**'
      - '**/rust-toolchain*'
      - 'musical-leptos/**'
      - 'musical-lights-worklet/**'
      - 'musical-lights-physics/**'
      - 'docs/audio-audit-results/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  core:
    name: rust (core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Cache Rust dependencies and builds
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            musical-lights-core/target
          key: core-rust-${{ runner.os }}-${{ runner.arch }}-nightly-2026-09-10-${{ hashFiles('musical-lights-core/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            core-rust-${{ runner.os }}-${{ runner.arch }}-nightly-2026-09-10-${{ hashFiles('musical-lights-core/Cargo.lock') }}-
      - name: Check deployment notification behavior
        run: python3 -m unittest discover -s validation/notification_tests -v
      - name: Install Rust
        run: rustup toolchain install nightly-2026-09-10 --profile minimal --component rust-src,rustfmt,clippy
      - run: python3 validation/validate.py core
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Cache Rust dependencies and builds
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            musical-lights-physics/target
            musical-lights-worklet/target
            musical-leptos/target
          key: site-rust-${{ runner.os }}-${{ runner.arch }}-nightly-2026-09-10-${{ hashFiles('musical-lights-physics/Cargo.lock', 'musical-lights-worklet/Cargo.lock', 'musical-leptos/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            site-rust-${{ runner.os }}-${{ runner.arch }}-nightly-2026-09-10-${{ hashFiles('musical-lights-physics/Cargo.lock', 'musical-lights-worklet/Cargo.lock', 'musical-leptos/Cargo.lock') }}-
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '26.8.2'
          cache: npm
          cache-dependency-path: validation/package-lock.json
      - name: Install Rust
        run: rustup toolchain install nightly-2026-09-10 --profile minimal --component rust-src,rustfmt,clippy --target wasm32-unknown-unknown
      - name: Check tool download handling
        run: python3 -m unittest discover -s validation/tooling -v
      - name: Cache pinned web tools
        id: web-tools
        uses: actions/cache@v6.1.0
        with:
          path: .tools
          key: site-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('validation/install_tools.py') }}
      - run: python3 validation/install_tools.py site
        if: steps.web-tools.outputs.cache-hit != 'true'
      - run: python3 validation/validate.py physics worklet leptos
      - run: cd validation && npm ci --ignore-scripts && npx playwright install --with-deps chromium webkit && npm run test:site
        env:
          DEBUG: pw:browser
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: browser-validation
          path: validation/test-results/
          if-no-files-found: ignore
      # Package the exact directory exercised by the browser suite. PRs also
      # produce the artifact so packaging is checked before a main deployment.
      - name: Package validated website
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ./musical-leptos/dist
          include-hidden-files: true
  loudness-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Cache Rust dependencies and builds
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            musical-lights-core/target
          key: reference-rust-${{ runner.os }}-${{ runner.arch }}-nightly-2026-09-10-${{ hashFiles('musical-lights-core/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            reference-rust-${{ runner.os }}-${{ runner.arch }}-nightly-2026-09-10-${{ hashFiles('musical-lights-core/Cargo.lock') }}-
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14.7'
      - name: Install reference environment tool
        run: python3 -m pip install uv==0.10.5
      - name: Install Rust
        run: rustup toolchain install nightly-2026-09-10 --profile minimal
      - run: python3 validation/validate.py reference
  pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [core, web, loudness-reference]
    outputs:
      deployed: ${{ steps.deployment.outcome == 'success' }}
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check that this is still main
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$GITHUB_SHA" = "$latest" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping superseded revision $GITHUB_SHA"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/configure-pages@v6.0.0
        if: steps.current.outputs.deploy == 'true'
      - uses: actions/deploy-pages@v5.0.1
        if: steps.current.outputs.deploy == 'true'
        id: deployment
  notify:
    name: Notify deployment result
    if: >-
      ${{ always() && !cancelled() && github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    needs: [core, web, loudness-reference, pages]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Publish deployment notification
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_RESULTS: ${{ toJSON(needs) }}
          NTFY_URL: ${{ vars.NTFY_URL }}
          NTFY_TOPIC: ${{ vars.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: |
          if ! LATEST_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha); then
            echo '::warning::Could not check current main; notification was skipped.'
            echo 'Notification skipped: could not check current main.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          export LATEST_SHA
          python3 validation/deploy_notification.py

name: Website validation and deployment
on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'musical-lights-core/**'
      - 'validation/**'
      - '!validation/demos.config.mjs'
      - '!validation/tests/other-apps.spec.mjs'
      - '.github/workflows/validate.yml'
      - '.github/workflows/gpu-runner-network.yml'
      - '**/.cargo/**'
      - '**/rust-toolchain*'
      - 'musical-leptos/**'
      - 'musical-lights-worklet/**'
      - 'musical-lights-physics/**'
      - 'docs/audio-audit-results/**'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  plan:
    name: Site plan
    runs-on: ubuntu-24.04
    concurrency:
      group: site-plan-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      reuse: ${{ steps.plan.outputs.reuse }}
      site_required: ${{ steps.plan.outputs.site_required }}
      run_id: ${{ steps.plan.outputs.run_id }}
      artifact_id: ${{ steps.plan.outputs.artifact_id }}
      tree: ${{ steps.plan.outputs.tree }}
      browser_matrix: ${{ steps.plan.outputs.browser_matrix }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/cache@v6.1.0
        id: ci-tools
        with:
          path: .tools
          key: ci-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('validation/install_tools.py') }}
      - run: python3 validation/install_tools.py ci
        if: steps.ci-tools.outputs.cache-hit != 'true'
      - run: .tools/bin/actionlint .github/workflows/*.yml
      - run: python3 -m unittest discover -s validation/tooling -v
      - run: python3 -m unittest discover -s validation/notification_tests -v
      - name: Resolve exact validated source tree
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 validation/ci.py plan
  core:
    name: rust (core)
    needs: plan
    if: needs.plan.outputs.site_required == 'true' && needs.plan.outputs.reuse != 'true'
    runs-on: ubuntu-24.04
    concurrency:
      group: site-core-${{ github.ref }}
      cancel-in-progress: true
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Cache workspace dependencies and builds
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: core-v2-${{ runner.os }}-${{ runner.arch }}-nightly-2026-09-10-${{ hashFiles('Cargo.lock', 'musical-lights-physics/Cargo.lock', 'validation/benchmarks/Cargo.lock') }}-${{ hashFiles('Cargo.toml', 'musical-lights-core/**', 'musical-lights-physics/**/*.rs', 'musical-lights-physics/Cargo.toml', 'musical-lights-worklet/**/*.rs', 'musical-lights-worklet/Cargo.toml', 'validation/benchmarks/**/*.rs', 'validation/benchmarks/Cargo.toml', '**/.cargo/**', '**/rust-toolchain*') }}
          restore-keys: |
            core-v2-${{ runner.os }}-${{ runner.arch }}-nightly-2026-09-10-${{ hashFiles('Cargo.lock', 'musical-lights-physics/Cargo.lock', 'validation/benchmarks/Cargo.lock') }}-
            core-v2-${{ runner.os }}-${{ runner.arch }}-nightly-2026-09-10-
      - name: Install Rust
        run: rustup toolchain install nightly-2026-09-10 --profile minimal --component rust-src,rustfmt,clippy
      - run: python3 validation/validate.py core physics-native benchmarks
  web:
    name: Build website
    needs: plan
    if: needs.plan.outputs.site_required == 'true'
    runs-on: ubuntu-24.04
    outputs:
      artifact_id: ${{ steps.compiled-bundle.outputs.artifact-id }}
    concurrency:
      group: site-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Restore exact validated bundle
        if: needs.plan.outputs.reuse == 'true'
        uses: actions/download-artifact@v8.0.1
        with:
          artifact-ids: ${{ needs.plan.outputs.artifact_id }}
          run-id: ${{ needs.plan.outputs.run_id }}
          github-token: ${{ github.token }}
          path: .ci/site
          merge-multiple: true
      - name: Verify and restore compiled packages
        if: needs.plan.outputs.reuse == 'true'
        env:
          PRODUCER_RUN: ${{ needs.plan.outputs.run_id }}
        run: python3 validation/ci.py unpack .ci/site "$PRODUCER_RUN"
      - name: Cache Rust dependencies and builds
        if: needs.plan.outputs.reuse != 'true'
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            musical-lights-physics/target
            musical-lights-worklet/target
            musical-leptos/target
          key: site-rust-${{ runner.os }}-${{ runner.arch }}-nightly-2026-09-10-${{ hashFiles('musical-lights-physics/Cargo.lock', 'musical-lights-worklet/Cargo.lock', 'musical-leptos/Cargo.lock') }}-${{ hashFiles('musical-lights-core/**/*.rs', 'musical-lights-core/Cargo.toml', 'musical-lights-physics/**/*.rs', 'musical-lights-physics/Cargo.toml', 'musical-lights-worklet/**/*.rs', 'musical-lights-worklet/Cargo.toml', 'musical-leptos/**/*.rs', 'musical-leptos/Cargo.toml', '**/.cargo/**', '**/rust-toolchain*') }}
          restore-keys: |
            site-rust-${{ runner.os }}-${{ runner.arch }}-nightly-2026-09-10-${{ hashFiles('musical-lights-physics/Cargo.lock', 'musical-lights-worklet/Cargo.lock', 'musical-leptos/Cargo.lock') }}-
            site-rust-${{ runner.os }}-${{ runner.arch }}-nightly-2026-09-10-
      - name: Cache renderer package downloads
        if: needs.plan.outputs.reuse != 'true'
        uses: actions/cache@v6.1.0
        with:
          path: .cache/npm
          key: renderer-npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('musical-leptos/package-lock.json') }}
      - uses: actions/setup-node@v7.0.0
        if: needs.plan.outputs.reuse != 'true'
        with:
          node-version: '26.12.1'
          cache: npm
          cache-dependency-path: validation/package-lock.json
      - name: Install Rust
        if: needs.plan.outputs.reuse != 'true'
        run: rustup toolchain install nightly-2026-09-10 --profile minimal --component rust-src,rustfmt,clippy --target wasm32-unknown-unknown
      - name: Cache pinned web tools
        if: needs.plan.outputs.reuse != 'true'
        id: web-tools
        uses: actions/cache@v6.1.0
        with:
          path: .tools
          key: site-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('validation/install_tools.py') }}
      - run: python3 validation/install_tools.py site
        if: needs.plan.outputs.reuse != 'true' && steps.web-tools.outputs.cache-hit != 'true'
      - name: Validate and build compiled packages once
        if: needs.plan.outputs.reuse != 'true'
        run: python3 validation/validate.py physics-wasm worklet leptos
      - name: Run offline checks and collect full browser inventory
        if: needs.plan.outputs.reuse != 'true'
        working-directory: validation
        run: |
          npm ci --ignore-scripts
          node --test harness/*.test.mjs
          mkdir -p ../.ci
          npx playwright test --project chromium --project chromium-permissions --project webkit-spectrum --project iphone-webkit --list --reporter=json > ../.ci/inventory.json
      - name: Record compiled bundle and digests
        if: needs.plan.outputs.reuse != 'true'
        run: python3 validation/ci.py pack .ci/site .ci/inventory.json
      - uses: actions/upload-artifact@v7.0.1
        id: compiled-bundle
        with:
          name: site-build-${{ github.run_attempt }}
          path: .ci/site
          include-hidden-files: true
          retention-days: 1
          overwrite: true
          if-no-files-found: error
  loudness-reference:
    needs: plan
    if: needs.plan.outputs.site_required == 'true' && needs.plan.outputs.reuse != 'true'
    runs-on: ubuntu-24.04
    concurrency:
      group: site-reference-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Cache workspace dependencies and builds
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: reference-v2-${{ runner.os }}-${{ runner.arch }}-nightly-2026-09-10-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('Cargo.toml', 'musical-lights-core/**', '**/.cargo/**', '**/rust-toolchain*') }}
          restore-keys: |
            reference-v2-${{ runner.os }}-${{ runner.arch }}-nightly-2026-09-10-${{ hashFiles('Cargo.lock') }}-
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14.7'
      - name: Install locked reference environment tool
        run: python3 -m pip install uv==0.10.5
      - name: Cache locked Python downloads
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/uv
          key: reference-uv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('validation/loudness/uv.lock') }}
      - name: Install Rust
        run: rustup toolchain install nightly-2026-09-10 --profile minimal
      - run: python3 validation/validate.py reference
  browser:
    name: Browser (${{ matrix.name }})
    needs: [plan, web]
    if: needs.plan.outputs.site_required == 'true' && needs.plan.outputs.reuse != 'true'
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --init --ipc=host --user 1001
    defaults:
      run:
        shell: bash
    concurrency:
      group: site-browser-${{ matrix.name }}-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.browser_matrix) }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          artifact-ids: ${{ needs.web.outputs.artifact_id }}
          path: .ci/site
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14.7'
      - run: python3 validation/ci.py unpack .ci/site "$GITHUB_RUN_ID"
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '26.12.1'
          cache: npm
          cache-dependency-path: validation/package-lock.json
      - name: Install locked browser SDK
        working-directory: validation
        run: npm ci --ignore-scripts
      - name: Run isolated browser group
        env:
          BROWSER_GROUP: ${{ matrix.name }}
          PROJECTS: ${{ matrix.projects }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/report.json
          DEBUG: pw:browser
        run: |
          python3 validation/ci.py browser-list .ci/site/inventory.json "$BROWSER_GROUP" .ci/browser-tests.txt
          cd validation
          read -r -a projects <<< "$PROJECTS"
          npx playwright test --test-list ../.ci/browser-tests.txt "${projects[@]}" --reporter=list,./browser-process-reporter.mjs,json
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: browser-report-${{ matrix.name }}
          path: validation/test-results/
          retention-days: ${{ job.status == 'failure' && 7 || 2 }}
          overwrite: true
          if-no-files-found: error
  gpu-network:
    needs: plan
    if: needs.plan.outputs.site_required == 'true'
    uses: ./.github/workflows/gpu-runner-network.yml
  gpu:
    name: GPU browser (${{ matrix.shard }})
    timeout-minutes: 60
    needs: [plan, web, gpu-network]
    if: needs.plan.outputs.site_required == 'true'
    runs-on: ci-musical-gpu
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    concurrency:
      group: site-gpu-${{ matrix.shard }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7.0.1
      # Record the actual failing Node/libc lookup in job logs, even if uploads
      # fail. Step env is required: GITHUB_ENV cannot set NODE_OPTIONS.
      - uses: actions/download-artifact@v8.0.1
        env:
          NODE_OPTIONS: --require "${{ github.workspace }}/validation/runner-network.cjs"
        with:
          artifact-ids: ${{ needs.web.outputs.artifact_id }}
          path: .ci/site
      - name: Verify the compiled site
        env:
          PRODUCER_RUN: ${{ needs.plan.outputs.run_id || github.run_id }}
        run: python3 validation/ci.py unpack .ci/site "$PRODUCER_RUN"
      - uses: actions/setup-node@v7.0.0
        env:
          NODE_OPTIONS: --require "${{ github.workspace }}/validation/runner-network.cjs"
        with:
          node-version: '26.12.1'
          cache: npm
          cache-dependency-path: validation/package-lock.json
      - uses: taiki-e/install-action@v2
        env:
          NODE_OPTIONS: --require "${{ github.workspace }}/validation/runner-network.cjs"
        with:
          tool: just
      - name: Run hardware-rendered browser checks
        env:
          NODE_OPTIONS: --require "${{ github.workspace }}/validation/runner-network.cjs"
        run: just validate-gpu --shard=${{ matrix.shard }}/2
      - name: Collect active-gap transition and latency evidence
        if: matrix.shard == 1
        env:
          NODE_OPTIONS: --require "${{ github.workspace }}/validation/runner-network.cjs"
        run: just validate-active-gap
      - uses: actions/upload-artifact@v7.0.1
        if: always() && matrix.shard == 1
        env:
          NODE_OPTIONS: --require "${{ github.workspace }}/validation/runner-network.cjs"
        with:
          name: active-gap-evidence
          path: .ci/active-gap/
          include-hidden-files: true
          retention-days: 7
          overwrite: true
          if-no-files-found: error
      # Each host runs one worker. Measure on one runner after its browser suite,
      # with the same downloaded site and instrumentation for both renderers.
      - name: Compare tilt lighting on software and hardware
        if: matrix.shard == 1
        env:
          DEBUG: pw:browser
        run: |
          set -o pipefail
          mkdir -p .ci/tilt-lighting
          just validate-tilt 2>&1 | tee .ci/tilt-lighting/commands.log
      - name: Publish tilt timing summary
        if: always() && matrix.shard == 1
        run: |
          if test -f .ci/tilt-lighting/comparison.md; then
            cat .ci/tilt-lighting/comparison.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7.0.1
        if: always() && matrix.shard == 1
        env:
          NODE_OPTIONS: --require "${{ github.workspace }}/validation/runner-network.cjs"
        with:
          name: tilt-lighting-comparison
          path: .ci/tilt-lighting/
          include-hidden-files: true
          retention-days: 7
          overwrite: true
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        env:
          NODE_OPTIONS: --require "${{ github.workspace }}/validation/runner-network.cjs"
        with:
          name: gpu-browser-report-${{ matrix.shard }}
          path: validation/test-results/
          retention-days: 7
          overwrite: true
          if-no-files-found: ignore
  validated:
    name: Validated website
    needs: [plan, core, web, loudness-reference, browser, gpu]
    if: >-
      ${{ always() && !cancelled() && needs.plan.result == 'success' && needs.web.result == 'success' && needs.gpu.result == 'success' &&
          (needs.plan.outputs.reuse == 'true' ||
           (needs.core.result == 'success' && needs.loudness-reference.result == 'success' && needs.browser.result == 'success')) }}
    runs-on: ubuntu-24.04
    concurrency:
      group: site-validated-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          artifact-ids: ${{ needs.web.outputs.artifact_id }}
          path: .ci/site
      - name: Verify producer and byte digests
        env:
          PRODUCER_RUN: ${{ needs.plan.outputs.run_id || github.run_id }}
        run: python3 validation/ci.py unpack .ci/site "$PRODUCER_RUN"
      - uses: actions/download-artifact@v8.0.1
        if: needs.plan.outputs.reuse != 'true'
        with:
          pattern: browser-report-*
          path: .ci/reports
      - name: Require complete browser coverage
        if: needs.plan.outputs.reuse != 'true'
        run: python3 validation/ci.py coverage .ci/site/inventory.json .ci/reports
      - name: Retain exact fully validated bundle
        if: needs.plan.outputs.reuse != 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: validated-site-${{ needs.plan.outputs.tree }}
          path: .ci/site
          include-hidden-files: true
          retention-days: 7
          overwrite: true
          if-no-files-found: error
      - name: Package the tested website
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: musical-leptos/dist
          include-hidden-files: true
          retention-days: 1
  required:
    name: Required website checks
    needs: [plan, validated]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - run: python3 validation/ci.py required-checks website
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
  pages:
    # Reuse skips ancestor test jobs. Check the validated result explicitly
    # instead of GitHub's implicit success() check across all ancestors.
    if: >-
      ${{ !cancelled() && needs.validated.result == 'success' && needs.required.result == 'success' &&
          github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    needs: [validated, required]
    outputs:
      deployed: ${{ steps.deployment.outcome == 'success' }}
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check that this is still main
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$GITHUB_SHA" = "$latest" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping superseded revision $GITHUB_SHA"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/configure-pages@v6.0.0
        if: steps.current.outputs.deploy == 'true'
      - uses: actions/deploy-pages@v5.0.1
        if: steps.current.outputs.deploy == 'true'
        id: deployment
  notify:
    name: Notify deployment result
    if: >-
      ${{ always() && !cancelled() && github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    needs: [plan, core, web, loudness-reference, browser, gpu, validated, required, pages]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Publish deployment notification
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_RESULTS: ${{ toJSON(needs) }}
          NTFY_URL: ${{ vars.NTFY_URL }}
          NTFY_TOPIC: ${{ vars.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: |
          if ! LATEST_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha); then
            echo '::warning::Could not check current main; notification was skipped.'
            echo 'Notification skipped: could not check current main.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          export LATEST_SHA
          python3 validation/deploy_notification.py

name: GPU incumbent parity (one-shot shadow)
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Independently routed incumbent physical GPU
        type: choice
        required: true
        options: [nuc3, t4, stage, os]
permissions:
  contents: read
  actions: read
concurrency:
  group: gpu-incumbent-parity-${{ inputs.profile }}
  cancel-in-progress: false
jobs:
  transfer:
    if: github.repository == 'BlinkyStitt/musical-lights-rs' && github.ref_name == 'dot/gpu-incumbent-parity-20261121' && (inputs.profile == 'nuc3' || inputs.profile == 't4')
    name: Shadow action transfer (${{ inputs.profile }})
    runs-on: ${{ inputs.profile == 'nuc3' && 'ci-musical-gpu-nuc3' || 'ci-musical-gpu-t4' }}
    timeout-minutes: 5
    steps:
      # No uses steps: the runner downloads ALL remote actions before any step.
      # Keep this probe inline so checkout failures cannot prevent observation.
      - name: Observe one native action-archive transfer
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM 90s python3 - <<'PY'
          import hashlib
          import json
          import os
          import socket
          import threading
          import time
          import urllib.request
          from functools import wraps
          from pathlib import Path
          from typing import Any

          # The exact checkout archive from failed run 41206913591. No credentials,
          # retries, alternate resolvers, address-family overrides or installations.
          ARCHIVE = "https://codeload.github.com/actions/checkout/tar.gz/3d3c42e5aac5ba805825da76410c181273ba90b1"


          def emit(event, **fields):
              print(
                  json.dumps(dict(event=event, at=time.time(), pid=os.getpid(), **fields)),
                  flush=True,
              )


          def native_state():
              paths = [
                  "/etc/resolv.conf",
                  "/etc/nsswitch.conf",
                  "/proc/net/route",
                  "/proc/net/ipv6_route",
                  "/proc/net/snmp",
                  "/proc/self/cgroup",
                  "/proc/self/status",
                  "/proc/self/limits",
              ]
              result = {}
              try:
                  for task in Path("/proc/self/task").iterdir():
                      paths.extend(str(task / name) for name in ("comm", "wchan", "syscall"))
              except OSError as error:
                  result["/proc/self/task"] = {
                      "error": type(error).__name__,
                      "errno": error.errno,
                  }
              for path in paths:
                  try:
                      with open(path, "rb") as source:
                          data = source.read(8193)
                      result[path] = {
                          "text": data[:8192].decode(errors="replace"),
                          "truncated": len(data) > 8192,
                      }
                  except OSError as error:
                      result[path] = {"error": type(error).__name__, "errno": error.errno}
              return result


          def capture():
              original = socket.getaddrinfo
              stop = threading.Event()

              @wraps(original)
              def lookup(host: Any, port: Any, *args: Any, **kwargs: Any) -> Any:
                  started = time.monotonic()
                  emit("lookup-start", host=host, port=port)
                  try:
                      addresses = original(host, port, *args, **kwargs)
                  except OSError as error:
                      emit(
                          "lookup-error",
                          host=host,
                          errno=error.errno,
                          error=type(error).__name__,
                          elapsed=time.monotonic() - started,
                          native=native_state(),
                      )
                      raise
                  emit(
                      "lookup-end",
                      host=host,
                      elapsed=time.monotonic() - started,
                      addresses=[{"family": a[0], "address": a[4][0]} for a in addresses],
                  )
                  return addresses

              def sample():
                  while not stop.wait(2):
                      emit("request-progress", native=native_state())

              emit("request-start", archive=ARCHIVE, native=native_state())
              sampler = threading.Thread(target=sample, daemon=True)
              # Preserve every native call signature; the injected-failure tests exercise
              # forwarding and restoration of this variadic observational wrapper.
              socket.getaddrinfo = lookup  # ty: ignore[invalid-assignment]
              sampler.start()
              started = time.monotonic()
              try:
                  with urllib.request.urlopen(ARCHIVE, timeout=30) as response:
                      data = response.read(8 * 1024 * 1024 + 1)
                      if response.status != 200 or not 0 < len(data) <= 8 * 1024 * 1024:
                          raise ValueError("Missing or oversized action archive")
                      emit(
                          "request-success",
                          status=response.status,
                          bytes=len(data),
                          sha256=hashlib.sha256(data).hexdigest(),
                      )
              except Exception as error:
                  # Do not print headers, proxy credentials or ambient environment.
                  emit(
                      "request-error",
                      error=type(error).__name__,
                      errno=getattr(error, "errno", None),
                  )
                  raise
              finally:
                  stop.set()
                  sampler.join()
                  socket.getaddrinfo = original
                  emit("request-end", elapsed=time.monotonic() - started, native=native_state())


          if __name__ == "__main__":
              try:
                  capture()
              except (OSError, ValueError):
                  raise SystemExit(1)
          PY
  gpu:
    needs: transfer
    name: Shadow GPU browser (${{ inputs.profile }}, shard ${{ matrix.shard }})
    runs-on: ${{ inputs.profile == 'nuc3' && 'ci-musical-gpu-nuc3' || 'ci-musical-gpu-t4' }}
    timeout-minutes: 35
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Observe guest GLX renderer and Chromium build
        env:
          EXPECTED_RENDERER: ${{ inputs.profile == 'nuc3' && 'virgl.*Intel' || 'virgl.*Tesla T4' }}
        shell: bash
        run: |
          set -euo pipefail
          if command -v glxinfo >/dev/null; then
            glx=$(glxinfo -B)
            renderer=$(grep -E '^OpenGL renderer string:' <<<"$glx")
            printf "%s\n" "$renderer"
            grep -Eiq "$EXPECTED_RENDERER" <<<"$renderer"
            if grep -Eiq 'llvmpipe|softpipe|swiftshader|software' <<<"$renderer"; then exit 1; fi
          else
            printf "%s\n" "Runner image does not ship glxinfo; use separate scoped guest readback."
          fi
          google-chrome --version
      - name: Verify Chrome uses the assigned GPU
        env:
          EXPECTED_RENDERER: ${{ inputs.profile == 'nuc3' && 'virgl.*Intel' || 'virgl.*Tesla T4' }}
        shell: bash
        run: |
          set -euo pipefail
          scratch=$(mktemp -d)
          trap 'rm -rf "$scratch"' EXIT
          cat > "$scratch/probe.html" <<'HTML'
          <!doctype html><html><body><script>
          const gl = document.createElement('canvas').getContext('webgl2');
          const debug = gl?.getExtension('WEBGL_debug_renderer_info');
          const renderer = debug ? gl.getParameter(debug.UNMASKED_RENDERER_WEBGL) : '';
          document.body.textContent = 'WEBGL_RENDERER=' + renderer;
          </script></body></html>
          HTML
          google-chrome --headless --no-sandbox --disable-dev-shm-usage \
            --use-gl=angle --use-angle=gl --enable-gpu \
            --user-data-dir="$scratch/profile" --dump-dom "file://$scratch/probe.html" \
            > "$scratch/result.html" 2> "$scratch/chrome.log" || {
              cat "$scratch/chrome.log"
              exit 1
            }
          python3 - "$scratch/result.html" <<'PY'
          from pathlib import Path
          import os
          import re
          import sys

          html = Path(sys.argv[1]).read_text()
          match = re.search(r'WEBGL_RENDERER=([^<\n]+)', html)
          if not match:
              raise SystemExit('Chrome did not report a WebGL renderer')
          renderer = match.group(1)
          print(f'WebGL renderer: {renderer}')
          if not re.search(os.environ['EXPECTED_RENDERER'], renderer, re.IGNORECASE):
              raise SystemExit('Chrome did not use the assigned GPU')
          if re.search(r'llvmpipe|softpipe|swiftshader|software', renderer, re.IGNORECASE):
              raise SystemExit('Chrome used a software renderer')
          PY
      - uses: actions/checkout@v7.0.1
        with:
          ref: f0a3b0b5e39e0f549daed3e105fbf4318cfd079a
          persist-credentials: false
      # Record the actual failing Node/libc lookup in job logs, even if uploads
      # fail. Step env is required: GITHUB_ENV cannot set NODE_OPTIONS.
      - uses: actions/download-artifact@v8.0.2
        env:
          NODE_OPTIONS: --require "${{ github.workspace }}/validation/runner-network.cjs"
        with:
          artifact-ids: 14692491706
          run-id: 44866114626
          github-token: ${{ github.token }}
          path: .ci/site
      - name: Verify the compiled site
        id: gpu-site
        env:
          PRODUCER_RUN: '44866114626'
          SITE_SOURCE: f0a3b0b5e39e0f549daed3e105fbf4318cfd079a
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SITE_SOURCE"
          python3 -c 'import json, os; from pathlib import Path; m=json.loads(Path(".ci/site/provenance.json").read_text()); assert m["source_commit"] == os.environ["SITE_SOURCE"]; assert m["repository"] == m["head_repository"] == os.environ["GITHUB_REPOSITORY"]'
          python3 validation/ci.py unpack .ci/site "$PRODUCER_RUN"
      - uses: actions/setup-node@v7.1.0
        env:
          NODE_OPTIONS: --require "${{ github.workspace }}/validation/runner-network.cjs"
        with:
          node-version: '26.12.1'
          cache: npm
          cache-dependency-path: validation/package-lock.json
      - uses: taiki-e/install-action@v2
        env:
          NODE_OPTIONS: --require "${{ github.workspace }}/validation/runner-network.cjs"
        with:
          tool: just
      - name: Run hardware-rendered browser checks
        env:
          ACTIVE_GAP_PROFILE: standard
          NODE_OPTIONS: --require "${{ github.workspace }}/validation/runner-network.cjs"
        run: just validate-gpu --shard=${{ matrix.shard }}/2
      - name: Collect active-gap transition and latency evidence
        if: ${{ !cancelled() && matrix.shard == 1 && steps.gpu-site.outcome == 'success' }}
        env:
          NODE_OPTIONS: --require "${{ github.workspace }}/validation/runner-network.cjs"
        run: just validate-active-gap
      - uses: actions/upload-artifact@v7.0.2
        if: always() && matrix.shard == 1
        env:
          NODE_OPTIONS: --require "${{ github.workspace }}/validation/runner-network.cjs"
        with:
          name: active-gap-evidence
          path: .ci/active-gap/
          include-hidden-files: true
          retention-days: 7
          overwrite: true
          if-no-files-found: error
      # Measure after the first browser shard with the same downloaded site
      # and instrumentation for both renderers.
      - name: Compare tilt lighting on software and hardware
        if: ${{ !cancelled() && matrix.shard == 1 && steps.gpu-site.outcome == 'success' }}
        env:
          DEBUG: pw:browser
        run: |
          set -o pipefail
          mkdir -p .ci/tilt-lighting
          just validate-tilt 2>&1 | tee .ci/tilt-lighting/commands.log
      - name: Publish tilt timing summary
        if: always() && matrix.shard == 1
        run: |
          if test -f .ci/tilt-lighting/comparison.md; then
            cat .ci/tilt-lighting/comparison.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7.0.2
        if: always() && matrix.shard == 1
        env:
          NODE_OPTIONS: --require "${{ github.workspace }}/validation/runner-network.cjs"
        with:
          name: tilt-lighting-comparison
          path: .ci/tilt-lighting/
          include-hidden-files: true
          retention-days: 7
          overwrite: true
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        env:
          NODE_OPTIONS: --require "${{ github.workspace }}/validation/runner-network.cjs"
        with:
          name: gpu-browser-report-${{ matrix.shard }}
          path: validation/test-results/
          retention-days: 7
          overwrite: true
          if-no-files-found: ignore
  stage-offline:
    if: github.repository == 'BlinkyStitt/musical-lights-rs' && github.ref_name == 'dot/gpu-incumbent-parity-20261121' && inputs.profile == 'stage'
    name: Stage exact offline GPU browser dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      SOURCE: f0a3b0b5e39e0f549daed3e105fbf4318cfd079a
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: f0a3b0b5e39e0f549daed3e105fbf4318cfd079a
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26.12.1'
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Capture only versioned toolchain and deterministic package caches
        shell: bash
        working-directory: validation
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          staging="$RUNNER_TEMP/gpu-offline"
          export NPM_CONFIG_CACHE="$staging/deps/npm-cache"
          export PLAYWRIGHT_BROWSERS_PATH="$staging/deps/ms-playwright"
          mkdir -p "$staging/deps/bin"
          node_root=$(dirname "$(dirname "$(command -v node)")")
          install -m 755 "$(command -v node)" "$staging/deps/bin/node"
          install -m 755 "$(command -v just)" "$staging/deps/bin/just"
          cp -a "$node_root/lib/node_modules/npm" "$staging/deps/npm"
          ln -s ../npm/bin/npm-cli.js "$staging/deps/bin/npm"
          ln -s ../npm/bin/npx-cli.js "$staging/deps/bin/npx"
          npm ci --ignore-scripts
          npx playwright install chromium webkit
          node --version > "$staging/node.txt"
          npm --version > "$staging/npm.txt"
          just --version > "$staging/just.txt"
          node -p "require('./node_modules/playwright/package.json').version" > "$staging/playwright.txt"
          sha256sum package-lock.json | cut -d' ' -f1 > "$staging/package-lock.sha256"
          rm -rf "$NPM_CONFIG_CACHE/_logs"
          tar -C "$staging" -cf "$RUNNER_TEMP/gpu-offline.tar" .
          sha256sum "$RUNNER_TEMP/gpu-offline.tar" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: gpu-offline-deps-f0a3b0b
          path: ${{ runner.temp }}/gpu-offline.tar
          retention-days: 2
          if-no-files-found: error

  stage-guest-os:
    if: github.repository == 'BlinkyStitt/musical-lights-rs' && github.ref_name == 'dot/gpu-incumbent-parity-20261121' && inputs.profile == 'os'
    name: Prepare disposable offline browser guest OS
    runs-on: ubuntu-24.04
    timeout-minutes: 27
    steps:
      - name: Install official image tools on the GitHub-hosted builder
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -qq update
          sudo apt-get -yq --no-install-recommends install libguestfs-tools qemu-utils
      - name: Build the inactive AMD64 Xorg and browser system image
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --proto '=https' --proto-redir '=https' --fail --location --retry 2 --max-time 180 \
            https://cloud-images.ubuntu.com/releases/noble/release-20260926/ubuntu-24.04-server-cloudimg-amd64.img \
            --output ubuntu-base.img
          printf '%s  %s\n' 6a81c37564db9b1ee84e141922625e1d7c5b389b99bb3c572e0243607d5bb4d2 ubuntu-base.img | sha256sum --check --strict
          qemu-img create -f qcow2 overlay.qcow2 12G
          disk_free=$(df -BG --output=avail "$RUNNER_TEMP" | tail -1 | tr -dc 0-9)
          test "$disk_free" -ge 9
          sudo env LIBGUESTFS_BACKEND=direct virt-resize --expand /dev/sda1 ubuntu-base.img overlay.qcow2
          echo 'Preparing Ubuntu software only; no repository data or credentials enter the image.'
          packages=(
            fonts-freefont-ttf fonts-ipafont-gothic fonts-liberation fonts-noto-color-emoji
            fonts-tlwg-loma-otf fonts-unifont fonts-wqy-zenhei git gstreamer1.0-libav gstreamer1.0-plugins-bad
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good libasound2t64 libatk-bridge2.0-0t64
            libatk1.0-0t64 libatomic1 libatspi2.0-0t64 libavif16 libcairo-gobject2 libcairo2 libcups2t64
            libdbus-1-3 libdrm2 libegl-mesa0 libenchant-2-2 libepoxy0 libevent-2.1-7t64 libflite1
            libfontconfig1 libfreetype6 libgbm1 libgdk-pixbuf-2.0-0 libgl1-mesa-dri libgles2 libglib2.0-0t64
            libglx-mesa0 libgstreamer-gl1.0-0 libgstreamer-plugins-bad1.0-0 libgstreamer-plugins-base1.0-0
            libgstreamer1.0-0 libgtk-4-1 libharfbuzz-icu0 libharfbuzz0b libhyphen0 libicu74 libjpeg-turbo8
            liblcms2-2 libmanette-0.2-0 libnspr4 libnss3 libopus0 libpango-1.0-0 libpangocairo-1.0-0
            libpng16-16t64 libsecret-1-0 libvpx9 libwayland-client0 libwayland-egl1 libwayland-server0
            libwebp7 libwebpdemux2 libwoff1 libx11-6 libx264-164 libxcb-dri3-0 libxcb1 libxcomposite1
            libxdamage1 libxext6 libxfixes3 libxkbcommon0 libxml2 libxrandr2 libxslt1.1 mesa-utils unzip
            x11-xkb-utils xauth xfonts-cyrillic xfonts-scalable xserver-xorg-core xvfb
          )
          printf '%s\n' "${packages[@]}" > "$RUNNER_TEMP/guest-packages.txt"
          mountdir="$RUNNER_TEMP/offline-guest-mount"
          mkdir "$mountdir"
          cleanup_mount() {
            # guestmount was run as root. The Actions user's mountpoint probe
            # gets EACCES on FUSE children and must not stand in for absence.
            if sudo mountpoint -q "$mountdir/proc"; then sudo umount "$mountdir/proc"; fi
            if sudo mountpoint -q "$mountdir/dev"; then sudo umount "$mountdir/dev"; fi
            if sudo mountpoint -q "$mountdir"; then sudo guestunmount "$mountdir"; fi
          }
          trap cleanup_mount EXIT
          sudo env LIBGUESTFS_BACKEND=direct guestmount -a overlay.qcow2 -i --rw --pid-file "$RUNNER_TEMP/guestmount.pid" "$mountdir"
          sudo mount --bind /dev "$mountdir/dev"
          sudo mount -t proc -o nosuid,nodev,noexec proc "$mountdir/proc"
          if sudo test -e "$mountdir/etc/resolv.conf" || sudo test -L "$mountdir/etc/resolv.conf"; then
            sudo mv "$mountdir/etc/resolv.conf" "$mountdir/etc/resolv.gpuprep"
          fi
          sudo cp -L /etc/resolv.conf "$mountdir/etc/resolv.conf"
          if sudo test -e "$mountdir/usr/sbin/policy-rc.d"; then
            sudo mv "$mountdir/usr/sbin/policy-rc.d" "$mountdir/usr/sbin/policy-rc.gpuprep"
          fi
          printf '%s\n' '#!/bin/sh' 'exit 101' | sudo tee "$mountdir/usr/sbin/policy-rc.d" >/dev/null
          sudo chmod 0755 "$mountdir/usr/sbin/policy-rc.d"
          chroot=(sudo chroot "$mountdir" /usr/bin/env -i HOME=/root LANG=C.UTF-8
            PATH=/usr/sbin:/usr/bin:/sbin:/bin DEBIAN_FRONTEND=noninteractive)
          "${chroot[@]}" /usr/bin/apt-get -qq update
          "${chroot[@]}" /usr/bin/apt-get --no-install-recommends -yq install "${packages[@]}"
          "${chroot[@]}" /usr/sbin/useradd --create-home --user-group --shell /usr/sbin/nologin --groups render gpu-test
          sudo systemctl --root="$mountdir" disable ssh.service ssh.socket || true
          "${chroot[@]}" /usr/bin/apt-get clean
          sudo truncate -s 0 "$mountdir/etc/machine-id"
          sudo find "$mountdir/etc/ssh" -maxdepth 1 -type f -name 'ssh_host_*' -delete
          sudo rm -f "$mountdir/etc/resolv.conf" "$mountdir/usr/sbin/policy-rc.d"
          if sudo test -e "$mountdir/etc/resolv.gpuprep" || sudo test -L "$mountdir/etc/resolv.gpuprep"; then
            sudo mv "$mountdir/etc/resolv.gpuprep" "$mountdir/etc/resolv.conf"
          fi
          if sudo test -e "$mountdir/usr/sbin/policy-rc.gpuprep"; then
            sudo mv "$mountdir/usr/sbin/policy-rc.gpuprep" "$mountdir/usr/sbin/policy-rc.d"
          fi
          sudo cat "$mountdir/var/lib/dpkg/status" | tee "$RUNNER_TEMP/guest-dpkg-status.txt" >/dev/null
          guestmount_pid=$(cat "$RUNNER_TEMP/guestmount.pid")
          test "$guestmount_pid" -gt 0
          cleanup_mount
          trap - EXIT
          if sudo mountpoint -q "$mountdir"; then
            echo 'The guest OS filesystem still has a live mount' >&2
            exit 1
          fi
          # A reaped or zombie FUSE process cannot hold an active image descriptor.
          state=unknown
          for _ in {1..60}; do
            state=$(ps -p "$guestmount_pid" -o stat= 2>/dev/null | tr -d '[:space:]' || :)
            if [[ -z "$state" || "$state" == Z* ]]; then break; fi
            sleep 1
          done
          printf 'guestmount process after unmount: %s\n' "${state:-exited}"
          [[ -z "$state" || "$state" == Z* ]]
          sudo qemu-img check -f qcow2 overlay.qcow2
          sudo qemu-img convert -c -O qcow2 overlay.qcow2 "$RUNNER_TEMP/guest-os.qcow2"
          sudo chown "$(id -u):$(id -g)" "$RUNNER_TEMP/guest-os.qcow2"
          test "$(qemu-img info --output=json "$RUNNER_TEMP/guest-os.qcow2" | jq -r 'has("backing-filename")')" = false
          sha256sum guest-os.qcow2 guest-dpkg-status.txt guest-packages.txt | tee guest-os.sha256
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: gpu-offline-noble-xorg-pilot
          path: |
            ${{ runner.temp }}/guest-os.qcow2
            ${{ runner.temp }}/guest-dpkg-status.txt
            ${{ runner.temp }}/guest-packages.txt
            ${{ runner.temp }}/guest-os.sha256
          retention-days: 2
          if-no-files-found: error

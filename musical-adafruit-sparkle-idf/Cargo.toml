[package]
name = "musical-adafruit-sparkle-idf"
version = "0.1.0"
authors = ["Bryan Stitt <bryan@stitthappens.com>"]
edition = "2021"
resolver = "2"

[[bin]]
name = "musical-adafruit-sparkle-idf"
harness = false # do not use the built in cargo test harness -> resolve rust-analyzer errors

[profile.release]
opt-level = "s"

[profile.dev]
debug = true    # Symbols are nice and they don't increase the size on Flash
opt-level = "z"

[features]
default = []

experimental = ["esp-idf-svc/experimental"]

[dependencies]
musical-lights-core = { path = "../musical-lights-core", default-features = false, features = [
    "alloc", "std", "log"
] }

dagc = "=0.1.1"
embedded-graphics = { version = "=0.8.2", features = ["nalgebra_support"] }

esp-idf-svc = "=0.52.1"

eyre = "=0.6.14"
flume = "=0.12.0"
heapless = { version = "=0.9.3", features = ["portable-atomic", "serde"] }
itertools = { version = "=0.15.0", default-features = false }
infrared = "=0.14.2"
log = "=0.4.34"
once_cell = { version = "=1.21.4", features = ["parking_lot", "portable-atomic", "critical-section"] }
postcard = "=1.1.3"
smart-leds = "=0.4.0"
smart-leds-trait = "=0.3.2"
static_cell = { version = "=2.1.1", features = [] }
ws2812-esp32-rmt-driver = { version = "=0.15.0-alpha.1", features = ["embedded-graphics-core", "smart-leds-trait", "std", "alloc"] }

[build-dependencies]
embuild = "=0.33.5"

# Upstream revisions add ESP-IDF 6.x support beyond the published crates.
[patch.crates-io]
esp-idf-svc = { git = "https://github.com/esp-rs/esp-idf-svc", rev = "81d64e2b23d8f1984e137e3b9760054e4d2e90e8" }
esp-idf-hal = { git = "https://github.com/esp-rs/esp-idf-hal", rev = "846cff17f3701b836fe461b6751d9e5c42b4b278" }
esp-idf-sys = { git = "https://github.com/esp-rs/esp-idf-sys", rev = "33045844f467fb8c66dfd78c3cacb0e218c3d26a" }

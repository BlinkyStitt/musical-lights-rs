[package]
name = "musical-feather-m0"
version = "0.1.0"
authors = ["Bryan Stitt <bryan@stitthappens.com>"]
description = "Musical Lights for the Adafruit Feather M0"
keywords = ["no-std", "arm", "cortex-m", "embedded-hal"]
categories = ["embedded", "hardware-support", "no-std"]
repository = "https://github.com/WyseNynja/musical-lights-rs"
readme = "README.md"
edition = "2024"
resolver = "2"

# for cargo flash
[package.metadata]
chip = "ATSAMD21G18A"

[dependencies]
heapless = { version = "=0.9.3", features = ["portable-atomic-critical-section"] }
cortex-m = { version = "=0.7.9", features = ["critical-section-single-core"] }
cortex-m-rt = "=0.7.6"
feather_m0 = "=0.20.4"
embassy-executor = { version = "=0.10.0", features = [
    "platform-cortex-m",
    "executor-thread",
    "log",
] }
embassy-sync = { version = "=0.8.0", features = ["log"] }
musical-lights-core = { path = "../musical-lights-core", default-features = false, features = ["libm", "log"] }
panic-halt = { version = "=1.0.0", optional = true }
panic-semihosting = { version = "=0.7.0", optional = true }

# # TODO: use defmt instead of log. it requires some extra setup though
log = "=0.4.34"

[features]
default = ["dep:panic-halt"]
use_semihosting = ["dep:panic-semihosting"]

[profile.dev]
incremental = false
codegen-units = 1
debug = true
lto = false

[profile.release]
debug = true
lto = true
opt-level = "s"

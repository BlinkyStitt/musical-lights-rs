[package]
name = "musical-lights-core"
version = "1.0.0"
edition = "2024"
resolver = "2"

[dependencies]
ahrs = { git = "https://github.com/jmagnuson/ahrs-rs", rev = "0b04dfe5e23fd0af9dbea1d24116e4c5b69d3ed9", default-features = false }
biquad = { version = "=0.6.0", default-features = false }
circular-buffer = { version = "=2.0.1", default-features = false }
cobs = { version = "=0.5.1", default-features = false }
crc = "=3.4.0"
defmt = { version = "=1.1.1", default-features = false, optional = true }
embassy-time = { optional = true, version = "=0.5.1" }
enterpolation = { version = "=0.3.0", default-features = false, features = [
    "bspline",
    "linear",
] }
heapless = { version = "=0.9.3", features = ["serde"] }
i24 = { version = "=2.3.5", default-features = false }
itertools = { version = "=0.15.0", default-features = false }
log = { version = "=0.4.34", default-features = false, optional = true }
microfft = { version = "=0.6.0", default-features = false, features = [
    "size-4096",
] }
micromath = "=2.1.0"
nalgebra = { version = "=0.35.0", default-features = false }
num = { version = "=0.4.3", default-features = false }
num-complex = { version = "=0.4.6", default-features = false }
palette = { version = "=0.7.7", default-features = false }
postcard = { version = "=1.1.3", features = ["experimental-derive", "use-crc"] }
serde = { version = "=1.0.229", default-features = false }
smart-leds = "=0.4.0"
thiserror = { version = "=2.0.20", default-features = false }

# # TODO: use these?

[dev-dependencies]
test-log = "=0.2.21"

[features]

default = ["std", "defmt"]

alloc = [
    "circular-buffer/alloc",
    "cobs/alloc",
    "i24/alloc",
    "num/alloc",
    "palette/alloc",
    "postcard/alloc",
    "serde/alloc",
    "defmt?/alloc",
]
defmt = [
    "dep:defmt",
    "cobs/defmt",
    "postcard/use-defmt",
    "heapless/defmt",
]
log = ["dep:log"]
embassy = ["dep:embassy-time"]
libm = [
    "palette/libm",
    "enterpolation/libm",
    "num/libm",
    "num-complex/libm",
]
std = [
    "ahrs/std",
    "cobs/use_std",
    "enterpolation/std",
    "i24/std",
    "log?/std",
    "microfft/std",
    "num-complex/std",
    "num/std",
    "palette/std",
    "postcard/use-std",
    "serde/std",
    "thiserror/std",
]

[[example]]
name = "bark_cost"
required-features = ["std"]

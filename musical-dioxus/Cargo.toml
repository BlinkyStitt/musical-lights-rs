[package]
name = "musical-dioxus"
version = "0.1.0"
authors = ["Bryan Stitt <bryan@stitthappens.com>"]
edition = "2024"
resolver = "2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
musical-lights-core = { path = "../musical-lights-core", features = ["log"] }

dioxus = { version = "=0.8.0-alpha.1", features = [] }

log = "=0.4.34"
js-sys = "=0.3.105"
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "=0.4.78"
web-sys = { version = "=0.3.105", features = [
    "console",
    "AudioContext",
    "AudioContextOptions",
    "AudioDestinationNode",
    "AudioWorklet",
    "AudioWorkletNode",
    "AudioWorkletNodeOptions",
    "BaseAudioContext",
    "BlobPropertyBag",
    "Document",
    "MediaDevices",
    "MediaStream",
    "MediaStreamConstraints",
    "MediaStreamAudioSourceNode",
    "MessagePort",
    "Navigator",
    "TextDecoder",
    "Window",
] }

[dev-dependencies]
wasm-bindgen-test = "=0.3.78"

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]

[profile.release]
opt-level = 'z'
lto = true
codegen-units = 1
panic = "abort"

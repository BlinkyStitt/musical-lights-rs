[package]
name = "musical-leptos"
version = "0.1.0"
edition = "2024"
authors = ["Bryan Stitt <bryan@stitthappens.com>"]
resolver = "2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
musical-lights-core = { path = "../musical-lights-core", features = ["log"] }

console_error_panic_hook = "=0.1.7"
console_log = "=1.1.0"
flume = "=0.12.0"
js-sys = "=0.3.105"
leptos = { version = "=0.9.0-beta", features = ["csr"] }
leptos_router = { version = "=0.9.0-beta1", features = [] }
log = "=0.4.34"
terrors = "=0.3.3"
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "=0.4.78"
web-sys = { version = "=0.3.105", features = [
    "console",
    "AudioContext",
    "AudioContextOptions",
    "AudioDestinationNode",
    "AudioWorklet",
    "AudioWorkletNode",
    "AudioWorkletNodeOptions",
    "BaseAudioContext",
    "BlobPropertyBag",
    "Document",
    "DomRect",
    "CssStyleDeclaration",
    "NodeList",
    "MediaDevices",
    "MediaQueryList",
    "MediaStream",
    "MediaStreamTrack",
    "MessageEvent",
    "Url",
    "MediaStreamConstraints",
    "MediaTrackConstraints",
    "MediaStreamAudioSourceNode",
    "MessagePort",
    "Navigator",
    "Performance",
    "ResizeObserver",
    "TextDecoder",
    "Window",
] }
num = "=0.4.3"

#leptos_workers = "0.2.1"
#serde = { version = "1.0.198", default-features = false, features = ["derive"] }

[dev-dependencies]
wasm-bindgen-test = "=0.3.78"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
